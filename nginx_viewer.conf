server {
  listen 80;
  absolute_redirect off;
  client_max_body_size 500M;
  root /usr/share/nginx/html;

  # Never let the DICOM server's 401/WWW-Authenticate reach the browser,
  # so no HTTP Basic auth dialog can ever pop up on the viewer port.
  proxy_hide_header WWW-Authenticate;

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/plain text/css text/javascript application/javascript application/json application/wasm image/svg+xml;

  # Mounted files are edited in place, so never cache them.
  location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate";
  }

  location = /app-config.js {
    add_header Cache-Control "no-cache, must-revalidate";
  }

  location = /custom.js {
    add_header Cache-Control "no-cache, must-revalidate";
  }

  location = /custom.css {
    add_header Cache-Control "no-cache, must-revalidate";
  }

  location = /manifest.json {
    add_header Cache-Control "no-cache, must-revalidate";
  }

  location = /favicon.svg {
    add_header Cache-Control "no-cache, must-revalidate";
  }

  # Build assets are content-hashed and safe to cache for a long time.
  location ~* \.(?:js|css|wasm|png|svg|ico|woff2?|ttf|eot)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Branded web viewer at root
  location / {
    index  index.html index.htm;
    try_files $uri $uri/ /index.html;
  }

  # DICOM server API (DICOMweb + REST)
  location ^~ /api/ {
    proxy_pass http://pacs-server:8041;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization "Basic YWRtaW46YWRtaW4uMTIzNA==";
    proxy_request_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    rewrite /api(.*) $1 break;
  }

  # DICOM server built-in web management interface
  location ^~ /apps/ {
    proxy_pass http://pacs-server:8041;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization "Basic YWRtaW46YWRtaW4uMTIzNA==";
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }

  error_page 500 502 503 504 /50x.html;
  location = /50x.html {
    add_header Cache-Control "no-cache, must-revalidate";
  }
}
