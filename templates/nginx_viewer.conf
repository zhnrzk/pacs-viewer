server {
  listen 80;
  client_max_body_size 500M;

  # Never let the DICOM server's 401/WWW-Authenticate reach the browser,
  # so no HTTP Basic auth dialog can ever pop up on the viewer port.
  proxy_hide_header WWW-Authenticate;

  # Branded web viewer at root
  location / {
    root   /usr/share/nginx/html;
    index  index.html index.htm;
    try_files $uri $uri/ /index.html;
  }

  # DICOM server API (DICOMweb + REST)
  location /api/ {
    proxy_pass http://pacs-server:{{HTTP_PORT}};
    proxy_set_header HOST $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Authorization "Basic {{AUTH_BASE64}}";
    rewrite /api(.*) $1 break;
  }

  # DICOM server built-in web management interface
  location /apps/ {
    proxy_pass http://pacs-server:{{HTTP_PORT}};
    proxy_set_header HOST $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Authorization "Basic {{AUTH_BASE64}}";
  }

  error_page 500 502 503 504 /50x.html;
  location = /50x.html {
    root /usr/share/nginx/html;
  }
}
