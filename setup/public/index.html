<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PACS viewer Setup</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; background: #0a0a0a; }
    body {
      display: flex;
      flex-direction: column;
      background: #0a0a0a;
      color: #d4d4d4;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;
      font-size: 14px;
      line-height: 1.55;
    }

    /* ---- header: minimal ---- */
    #header {
      flex-shrink: 0;
      padding: 12px 20px;
      color: #e5e7eb;
      font-weight: 700;
      font-size: 15px;
      letter-spacing: 0.02em;
      border-bottom: 1px solid #141518;
    }

    #frame {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }

    /* ---- body: single scrollable output panel ---- */
    #body-wrap {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      padding: 4px 20px;
    }
    #body {
      flex: 1;
      overflow-y: auto;
      padding: 4px 0 8px;
      scrollbar-width: thin;
    }
    #body::-webkit-scrollbar { width: 8px; }
    #body::-webkit-scrollbar-track { background: transparent; }
    #body::-webkit-scrollbar-thumb { background: #26282f; border-radius: 4px; }
    #body::-webkit-scrollbar-thumb:hover { background: #34373f; }

    .b { white-space: pre; }
    .ln { white-space: pre-wrap; word-break: break-word; padding-left: 2px; }
    .dim { color: #555; }
    .grn { color: #22c55e; }
    .red { color: #ef4444; }
    .amb { color: #f59e0b; }
    .wht { color: #fff; font-weight: bold; }
    .plr { color: #94a3b8; }
    .fix { color: #555; }
    .boxdim { color: #3a3d46; }

    /* ---- section header ---- */
    .sec {
      color: #c8c8c8;
      font-weight: 700;
      letter-spacing: 0.02em;
      padding: 2px 0;
      margin-top: 6px;
    }
    .sec-rule {
      border-top: 1px solid #17181c;
      margin: 4px 0 8px;
    }

    /* ---- input prompt panel ---- */
    #input-area {
      display: none;
      flex-shrink: 0;
      padding: 0 8px 2px;
    }
    .input-box {
      display: flex;
      background: #0d0f13;
      border: 1px solid #26282f;
      border-radius: 4px;
    }
    .input-box.focused { border-color: #777; box-shadow: none; }
    .accent-bar {
      display: flex;
      align-items: stretch;
      width: 3px;
      background: #666;
      border-radius: 4px 0 0 4px;
      flex-shrink: 0;
    }
    .input-inner {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 9px 12px;
      min-width: 0;
    }
    .prompt-label {
      color: #64748b;
      font-size: 12px;
      margin-bottom: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #cmd {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #d4d4d4;
      font-family: inherit;
      font-size: inherit;
      line-height: inherit;
      caret-color: #999;
      padding: 0;
    }
    #cmd::selection { background: #26282f; color: #fff; }
    #cmd::placeholder { color: #444; }

    /* ---- upload zone ---- */
    #upload-zone {
      display: none;
      flex-shrink: 0;
      padding: 0 8px 2px;
    }
    .upload-box {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #0d0f13;
      border: 1px solid #333;
      border-radius: 4px;
      padding: 12px 16px;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }
    .upload-box:hover { border-color: #777; background: #101318; }
    .upload-box .icon { color: #999; font-size: 18px; flex-shrink: 0; }
    .upload-box .info { flex: 1; min-width: 0; }
    .upload-box .info .label { color: #d4d4d4; font-size: 13px; }
    .upload-box .info .hint { color: #64748b; font-size: 12px; margin-top: 2px; }

    .file-pill {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #0d0f13;
      border: 1px solid #26282f;
      border-radius: 4px;
      padding: 8px 12px;
    }
    .file-pill .thumb {
      width: 32px;
      height: 32px;
      border-radius: 3px;
      object-fit: cover;
      border: 1px solid #333;
      flex-shrink: 0;
    }
    .file-pill .icon { color: #999; font-size: 16px; flex-shrink: 0; }
    .file-pill .meta { flex: 1; min-width: 0; }
    .file-pill .meta .name { color: #d4d4d4; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .file-pill .meta .size { color: #64748b; font-size: 12px; }
    .file-pill .remove {
      color: #555;
      cursor: pointer;
      font-size: 16px;
      flex-shrink: 0;
      transition: color 0.15s;
      background: none;
      border: none;
      font-family: inherit;
      padding: 0;
    }
    .file-pill .remove:hover { color: #ef4444; }

    .warn-line { color: #f59e0b; }
    .thumb-preview {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 0 0 22px;
    }
    .thumb-preview img {
      width: 48px;
      height: 48px;
      border-radius: 4px;
      object-fit: contain;
      border: 1px solid #333;
      background: #111;
    }

    /* ---- status footer ---- */
    #status-bar {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      height: 30px;
      border-top: 1px solid #141518;
      font-size: 12px;
      color: #4c515b;
    }
    #status-bar .step { color: #8b93a1; }
    #status-bar .hints { color: #4c515b; font-size: 11px; display: flex; gap: 12px; }
    #status-bar .hints kbd {
      background: #101114;
      border: 1px solid #22242a;
      border-radius: 3px;
      padding: 0 5px;
      font-family: inherit;
      font-size: 11px;
      color: #9aa3b2;
    }
  </style>
</head>
<body>
  <div id="frame">
    <div id="header">PACS viewer Setup Wizard</div>

    <div id="body-wrap">
      <div id="body"></div>
    </div>

    <div id="input-area">
      <div class="input-box" id="input-box">
        <div class="accent-bar"></div>
        <div class="input-inner">
          <span class="prompt-label" id="ptxt"></span>
          <input id="cmd" type="text" autocomplete="off" spellcheck="false">
        </div>
      </div>
    </div>

    <div id="upload-zone"></div>
    <input type="file" id="logofile" accept="image/*" style="display:none">

    <div id="status-bar">
      <span class="step" id="step-text"></span>
      <span class="hints">
        <span><kbd>Enter</kbd> confirm</span>
        <span><kbd>Tab</kbd> switch mode</span>
      </span>
    </div>
  </div>
  <script>
    var B = document.getElementById('body');
    var inputArea = document.getElementById('input-area');
    var inputBox = document.getElementById('input-box');
    var ptxt = document.getElementById('ptxt');
    var cmd = document.getElementById('cmd');
    var fileInput = document.getElementById('logofile');
    var statusStep = document.getElementById('step-text');

    var STEP_TOTAL = 14;
    var stepCurrent = 0;

    function setStep(n, label) {
      stepCurrent = n;
      statusStep.innerHTML = '<span class="step"> > Step ' + n + '/' + STEP_TOTAL + ' &middot; ' + label + '</span>';
    }

    function print(text, cls) {
      var d = document.createElement('div');
      d.className = 'ln' + (cls ? ' ' + cls : '');
      d.textContent = text;
      B.appendChild(d);
      B.scrollTop = B.scrollHeight;
    }

    function printHTML(html) {
      var d = document.createElement('div');
      d.className = 'ln';
      d.innerHTML = html;
      B.appendChild(d);
      B.scrollTop = B.scrollHeight;
    }

    /* ---- section header helpers (clean, flat) ---- */
    function sec(label) {
      var d = document.createElement('div');
      d.className = 'sec';
      d.textContent = '\u203a ' + label;
      B.appendChild(d);
      var r = document.createElement('div');
      r.className = 'sec-rule';
      B.appendChild(r);
      B.scrollTop = B.scrollHeight;
    }
    // Plain indented content row (no box gutter)
    function boxRow(text, cls) {
      var d = document.createElement('div');
      d.className = 'ln' + (cls ? ' ' + cls : '');
      d.textContent = text;
      B.appendChild(d);
      B.scrollTop = B.scrollHeight;
    }

    function wait(ms) { return new Promise(function(r) { setTimeout(r, ms); }); }

    function showInput(label, def, secret) {
      inputArea.style.display = 'block';
      ptxt.textContent = label;
      cmd.type = secret ? 'password' : 'text';
      cmd.value = def || '';
      inputBox.classList.add('focused');
      requestAnimationFrame(function() { cmd.focus(); cmd.select(); });
    }

    function hideInput() {
      inputArea.style.display = 'none';
      inputBox.classList.remove('focused');
    }

    function ask(label, def, secret) {
      return new Promise(function(resolve) {
        setStep(stepCurrent + 1, label);
        showInput(label + (secret ? '' : ' [' + def + ']'), def, secret);

        function onKey(e) {
          if (e.key !== 'Enter') return;
          e.preventDefault();
          cmd.removeEventListener('keydown', onKey);
          var val = cmd.value || def;
          var display = secret ? '\u25cf'.repeat(val.length) : val;
          boxRow('  >  ' + label + ': ' + display, 'plr');
          hideInput();
          resolve(val);
        }
        cmd.addEventListener('keydown', onKey);
      });
    }

    function askFile(label) {
      return new Promise(function(resolve) {
        setStep(stepCurrent + 1, label);
        var result = '';
        var pillEl = null;

        function showBrowse() {
          inputArea.style.display = 'none';
          var zone = document.createElement('div');
          zone.id = 'upload-zone-inner';
          zone.innerHTML =
            '<div class="upload-box" id="upload-box">' +
              '<span class="icon"> + </span>' +
              '<div class="info">' +
                '<div class="label">' + label + '</div>' +
                '<div class="hint">Click to browse &middot; PNG, SVG, JPG, GIF</div>' +
              '</div>' +
            '</div>';
          document.getElementById('upload-zone').appendChild(zone);
          document.getElementById('upload-zone').style.display = 'block';
          B.scrollTop = B.scrollHeight;

          var box = document.getElementById('upload-box');
          box.addEventListener('click', function() {
            fileInput.click();
          });

          fileInput.onchange = function() {
            var f = fileInput.files && fileInput.files[0];
            fileInput.value = '';
            if (!f) { return; }
            handleFile(f);
          };
        }

        function handleFile(f) {
          var sizeKB = (f.size / 1024).toFixed(1);
          var isImage = /^image\//.test(f.type);
          var thumbHTML = '';

          if (isImage) {
            var reader = new FileReader();
            reader.onload = function() {
              thumbHTML = '<div class="thumb-preview"><img src="' + reader.result + '" alt="preview"></div>';
              showPill(f, sizeKB, thumbHTML);
            };
            reader.readAsDataURL(f);
          } else {
            showPill(f, sizeKB, '');
          }

          function showPill(f, sizeKB, thumbHTML) {
            var old = document.getElementById('upload-zone-inner');
            if (old) old.remove();
            if (pillEl) pillEl.remove();

            var warnHTML = '';
            if (f.size > 102400) {
              warnHTML = '<div class="ln warn-line" style="padding:4px 0 0 22px;">  !  File is ' + sizeKB + ' KB \u2014 large logos may slow initial load</div>';
            }

            var pill = document.createElement('div');
            pill.id = 'file-pill';
            pill.innerHTML =
              '<div class="file-pill">' +
                '<span class="icon"> # </span>' +
                '<div class="meta">' +
                  '<div class="name">' + f.name + '</div>' +
                  '<div class="size">' + sizeKB + ' KB</div>' +
                '</div>' +
                '<button class="remove" title="Remove"> x </button>' +
              '</div>' +
              thumbHTML +
              warnHTML;

            document.getElementById('upload-zone').appendChild(pill);
            B.scrollTop = B.scrollHeight;
            pillEl = pill;

            pill.querySelector('.remove').addEventListener('click', function() {
              pill.remove();
              pillEl = null;
              result = '';
              showBrowse();
            });

            var reader2 = new FileReader();
            reader2.onload = function() {
              result = reader2.result;
              resolve(result);
            };
            reader2.onerror = function() { resolve(''); };
            reader2.readAsDataURL(f);
          }
        }

        showBrowse();
      });
    }

    async function main() {
      print('');
      boxRow('PACS viewer Setup Wizard', 'wht');
      boxRow('Configure the DICOM / OHIF viewer stack and deploy.', 'dim');
      print('');

      var data;
      try {
        var r = await fetch('/api/preflight');
        data = await r.json();
      } catch (e) {
        print('  x  Cannot reach server: ' + e.message, 'red');
        return;
      }

      sec('Preflight checks');
      for (var i = 0; i < data.checks.length; i++) {
        await wait(120);
        var c = data.checks[i];
        var tag, cls;
        if (c.status === 'pass') { tag = 'ok'; cls = 'grn'; }
        else if (c.status === 'fail') { tag = 'x'; cls = 'red'; }
        else { tag = '!'; cls = 'amb'; }
        boxRow('  ' + tag + '  ' + c.name, cls);
        if (c.fix) boxRow('      -  ' + c.fix, 'fix');
      }

      var ok = data.checks.every(function(c) { return c.status !== 'fail'; });
      print('');
      print(ok ? '  ok  All checks passed.' : '  !  Some checks failed. Deployment may fail.', ok ? 'grn' : 'amb');
      print('');

      sec('Configuration');
      var C = {};
      var fields = [
        ['appName',         'Application name',    'PACS Viewer', false],
        ['footerText',      'Footer text',         'Radiology Department', false],
        ['viewerPort',      'Viewer port',         '3000', false],
        ['httpPort',        'DICOM server HTTP port', '8041', false],
        ['dicomPort',       'DICOM port',          '104', false],
        ['aet',             'AET',                  'PACS', false],
        ['dicomServerName', 'DICOM server name',    'DICOM server', false],
        ['username',        'Username',             'admin', false],
        ['password',        'Password',             'admin.1234', true],
        ['networkName',     'Docker network',       'pacs', false],
        ['showLogo',        'Show logo in header',  'Y', false],
      ];
      for (var j = 0; j < fields.length; j++) {
        var f = fields[j];
        C[f[0]] = await ask(f[1], f[2], f[3]);
      }

      var wantLogo = await ask('Attach a custom logo image?', 'N');
      C.logo = '';
      if (/^[Yy]/.test(wantLogo)) {
        C.logo = await askFile('Select logo image');
      }

      print('');
      sec('Summary');
      var summaryRows = [
        ['app_name',     C.appName],
        ['footer',       C.footerText],
        ['viewer_port',  C.viewerPort],
        ['http_port',    C.httpPort],
        ['dicom_port',   C.dicomPort],
        ['aet',          C.aet],
        ['server_name',  C.dicomServerName],
        ['username',     C.username],
        ['password',     '\u2022'.repeat(Math.min(C.password.length, 12))],
        ['network',      C.networkName],
        ['show_logo',    C.showLogo],
        ['custom_logo',  C.logo ? '# attached' : 'none'],
      ];
      for (var k = 0; k < summaryRows.length; k++) {
        boxRow('  ' + summaryRows[k][0].padEnd(16) + summaryRows[k][1]);
      }
      print('');

      setStep(stepCurrent + 1, 'Confirm deployment');
      var yes = await ask('Proceed with deployment?', 'Y');
      if (!/^[Yy]/.test(yes)) {
        print('');
        print('  x  Aborted.', 'amb');
        return;
      }

      print('');
      print('  >  Generating configuration files...', 'dim');

      try {
        var dr = await fetch('/api/deploy', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            appName: C.appName,
            footerText: C.footerText,
            viewerPort: parseInt(C.viewerPort) || 3000,
            httpPort: parseInt(C.httpPort) || 8041,
            dicomPort: parseInt(C.dicomPort) || 104,
            aet: C.aet,
            dicomServerName: C.dicomServerName,
            username: C.username,
            password: C.password,
            networkName: C.networkName,
            showLogo: C.showLogo,
            logo: C.logo,
          }),
        });
        var res = await dr.json();

        if (res.success) {
          sec('Deploy');
          var files = ['pacs-server.json','nginx_viewer.conf','viewer.js','index.html','manifest.json','docker-compose.yml'];
          for (var m = 0; m < files.length; m++) {
            await wait(60);
            boxRow('  ok  ' + files[m], 'grn');
          }
          print('');
          print('  >  Starting services...', 'dim');
          await wait(300);
          print('');
          print('  ok  Deployment complete.', 'grn');
          print('  @  Viewer: ' + res.viewerUrl, 'wht');
          print('');
          print('  Refresh this page to reconfigure.', 'dim');
          statusStep.innerHTML = '<span class="step"> ok  Deployed</span>';
        } else {
          print('');
          print('  x  Deployment failed:', 'red');
          print('  ' + res.error, 'red');
        }
      } catch (e) {
        print('');
        print('  x  Deployment failed: ' + e.message, 'red');
      }
    }

    document.addEventListener('click', function() {
      if (inputArea.style.display !== 'none') cmd.focus();
    });

    main();
  </script>
</body>
</html>
