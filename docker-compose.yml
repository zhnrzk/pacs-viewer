#version: "3"
services:
  pacs-server:
    container_name: pacs-server
    image: jodogne/orthanc-plugins:1.12.11
    ports:
      - 104:104
      - 8041:8041
    volumes:
      - ./pacs-server.json:/etc/orthanc/orthanc.json:ro
      - ./lua:/etc/orthanc/lua:ro
      - ./data:/var/lib/orthanc/db/
    restart: always
    networks:
      - pacs

  pacs-viewer:
    container_name: pacs-viewer
    image: ohif/viewer
    ports:
      - 3000:80
    environment:
      - APP_CONFIG=/usr/share/nginx/html/app-config.js
    volumes:
      - ./nginx_viewer.conf:/etc/nginx/conf.d/default.conf:ro
      - ./viewer.js:/usr/share/nginx/html/app-config.js:ro
      - ./manifest.json:/usr/share/nginx/html/manifest.json:ro
      - ./assets/custom.css:/usr/share/nginx/html/custom.css:ro
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./assets/favicon.svg:/usr/share/nginx/html/favicon.svg:ro
    restart: always
    networks:
      - pacs

networks:
  pacs:
    external: true
