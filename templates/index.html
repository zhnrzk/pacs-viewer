  <noscript> You need to enable JavaScript to run this app. </noscript>

  <div id="root"></div>

  <script>
    (function() {
      var LOGO_SVG = '{{SHOW_LOGO}}' === 'true'
        ? '<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="400" height="32" viewBox="0 0 400 32">' +
          '<image xlink:href="{{LOGO_HREF}}" href="{{LOGO_HREF}}" x="0" y="1" width="30" height="30" preserveAspectRatio="xMidYMid meet"/>' +
          '<text x="38" y="22" fill="#ffffff" font-size="17" font-weight="400" ' +
          'font-family="Roboto,sans-serif" letter-spacing="0.2">{{APP_NAME}}</text>' +
          '</svg>'
        : '';
      function hideInvestigational() {
        var walker = document.createTreeWalker(
          document.body, NodeFilter.SHOW_TEXT, null, false
        );
        var nodes = [];
        while (walker.nextNode()) {
          if (/INVESTIGATIONAL\s*USE\s*ONLY/i.test(walker.currentNode.nodeValue)) {
            nodes.push(walker.currentNode.parentElement);
          }
        }
        nodes.forEach(function(el) { el.style.display = 'none'; });
      }
      function hideOptions() {
        var el = document.getElementById('options');
        if (el) { el.style.display = 'none'; return; }
        el = document.getElementById('options-settings-icon');
        if (el) { el.style.display = 'none'; return; }
        var btns = document.querySelectorAll('[class*="settings"], [id*="settings"], [class*="option"], [id*="option"]');
        btns.forEach(function(b) {
          if (b.closest('nav, .navbar, .header, [class*="header"], [class*="Nav"]')) {
            b.style.display = 'none';
          }
        });
      }
      function replaceLogo() {
        if (!LOGO_SVG) return;
        var brands = document.querySelectorAll('.header-brand');
        brands.forEach(function(brand) {
          if (brand.querySelector('.custom-brand-logo')) return;
          brand.removeAttribute('href');
          brand.removeAttribute('target');
          brand.style.cursor = 'default';
          var imgs = brand.querySelectorAll('.header-logo-image, .header-logo-text');
          imgs.forEach(function(img) { img.style.display = 'none'; });
          var wrapper = document.createElement('div');
          wrapper.className = 'custom-brand-logo';
          wrapper.style.cssText = 'display:flex;align-items:center;height:32px;margin-left:8px;';
          wrapper.innerHTML = LOGO_SVG;
          brand.appendChild(wrapper);
        });
      }
      function hideStudyListHeading() {
        var walker = document.createTreeWalker(
          document.body, NodeFilter.SHOW_TEXT, null, false
        );
        while (walker.nextNode()) {
          var text = walker.currentNode.nodeValue.trim();
          if (text === 'Study List' || text === 'StudyList') {
            var el = walker.currentNode.parentElement;
            while (el && el !== document.body) {
              if (el.clientHeight > 0 && el.clientHeight < 80) {
                el.style.display = 'none';
                break;
              }
              el = el.parentElement;
            }
          }
          if (text === 'Start Date' || text === 'End Date') {
            var el3 = walker.currentNode.parentElement;
            if (el3) el3.style.display = 'none';
          }
        }
        var descInputs = document.querySelectorAll('input[placeholder*="Description" i],input[placeholder*="description" i]');
        descInputs.forEach(function(input) {
          var wrapper = input.closest('[class*="cell"],[class*="Cell"],[class*="col"],[class*="Col"],div');
          if (wrapper) wrapper.style.display = 'none';
        });
      }
      function forceDarkMode() {
        document.querySelectorAll('*').forEach(function(el) {
          var bg = window.getComputedStyle(el).backgroundColor;
          if (bg === 'rgb(255, 255, 255)' || bg === 'rgb(248, 248, 248)' || bg === 'rgb(240, 240, 240)' || bg === 'rgb(245, 245, 245)') {
            el.style.setProperty('background', 'var(--ui-gray, #141414)', 'important');
            el.style.setProperty('background-color', 'var(--ui-gray, #141414)', 'important');
            el.style.setProperty('color', 'var(--text-primary-color, #c8c8c8)', 'important');
          }
        });
      }
      setInterval(forceDarkMode, 500);
      new MutationObserver(function() { replaceLogo(); hideInvestigational(); hideOptions(); hideStudyListHeading(); })
        .observe(document.body || document.documentElement, { childList: true, subtree: true });
      replaceLogo();
      hideInvestigational();
      hideOptions();
      hideStudyListHeading();
      window.addEventListener('load', function() { replaceLogo(); hideInvestigational(); hideOptions(); });
    })();
  </script>
